<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Dark Frame -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#0f172a" fill-opacity="0.25" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Math Symbol Grid -->
  <g fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" filter="url(#glow)">
    <!-- Plus -->
    <text x="170" y="210" font-size="110">+</text>
    <!-- Minus -->
    <text x="342" y="210" font-size="110">−</text>
    <!-- Multiply -->
    <text x="170" y="380" font-size="100">×</text>
    <!-- Divide -->
    <text x="342" y="380" font-size="100">÷</text>
  </g>
</svg>
